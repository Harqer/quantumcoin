name: sha256-transmon-tests

on:
  push:
    branches: [main]
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"
      - ".github/workflows/sha256-transmon-tests.yml"
  pull_request:
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_sha256_transmon_d8.py tests/test_sha256_coherent_nonce.py tests/test_sha256_coherent_dag.py tests/test_sha256_coherent_pebble.py tests/test_sha256_coherent_round16.py tests/test_sha256_coherent_checkpoint.py tests/test_sha256_luna_lowering.py tests/test_sha256_carrier_ir.py
