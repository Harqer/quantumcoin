name: sha256-transmon-tests

on:
  push:
    branches: [main]
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"
      - ".github/workflows/sha256-transmon-tests.yml"
  pull_request:
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_sha256_*.py
      - name: Report coherent schedule depth
        run: >-
          python -c "from quantum.sha256_transmon_d8.coherent_schedule import bitcoin_second_block_template;
          from quantum.sha256_transmon_d8.coherent_dag import select_schedule_dag, build_schedule_dag_candidates;
          from quantum.sha256_transmon_d8.coherent_stream import streamed_word_add_gate_count;
          d=select_schedule_dag(bitcoin_second_block_template(),3);
          counts=[streamed_word_add_gate_count(d,t) for t in d.stats.dynamic_schedule_words];
          print(d.arithmetic, d.stats);
          print('streamed_max_gates', max(counts), 'digits', len(str(max(counts)))); [(lambda cc: print('candidate', cc.arithmetic, 'and_depth', cc.stats.max_and_depth, 'nodes', cc.stats.node_count, 'max_gates_digits', len(str(max(streamed_word_add_gate_count(cc,t) for t in cc.stats.dynamic_schedule_words))), 'total_gates_digits', len(str(sum(streamed_word_add_gate_count(cc,t) for t in cc.stats.dynamic_schedule_words)))))(cc) for cc in build_schedule_dag_candidates(bitcoin_second_block_template(),3)];
          from quantum.sha256_transmon_d8.coherent_stream import plan_stream_checkpoints;
          p=plan_stream_checkpoints(d,63);
          print('W63_checkpoint_bits',len(p.cached_nodes),'projected_digits',len(str(p.projected_gate_count)),'dirty',p.max_effective_dirty_bits,'available',p.available_dirty_bits)"
