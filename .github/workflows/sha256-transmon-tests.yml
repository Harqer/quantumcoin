name: sha256-transmon-tests

on:
  push:
    branches: [main]
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"
      - ".github/workflows/sha256-transmon-tests.yml"
  pull_request:
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_sha256_*.py
      - name: Report coherent schedule depth
        run: >-
          python -c "from quantum.sha256_transmon_d8.coherent_schedule import bitcoin_second_block_template;
          from quantum.sha256_transmon_d8.coherent_dag import select_schedule_dag;
          d=select_schedule_dag(bitcoin_second_block_template(),3);
          from quantum.sha256_transmon_d8.coherent_stream import streamed_word_add_gate_count;\n          counts=[streamed_word_add_gate_count(d,t) for t in d.stats.dynamic_schedule_words];\n          print(d.arithmetic, d.stats); print(\"streamed_max_gates\", max(counts), \"digits\", len(str(max(counts))))"
