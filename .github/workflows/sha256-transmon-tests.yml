name: sha256-transmon-tests

on:
  push:
    branches: [main]
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"
      - ".github/workflows/sha256-transmon-tests.yml"
  pull_request:
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_sha256_*.py\n      - name: Report coherent schedule depth\n        run: python -c "from quantum.sha256_transmon_d8.coherent_schedule import bitcoin_second_block_template; from quantum.sha256_transmon_d8.coherent_dag import select_schedule_dag; d=select_schedule_dag(bitcoin_second_block_template(),3); print(d.arithmetic, d.stats)"
