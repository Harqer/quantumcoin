name: Verified Quantum Optimizers

permissions:
  contents: read

on:
  push:
    paths:
      - "quantum/sha256_transmon_d8/zx_optimization.py"
      - "quantum/sha256_transmon_d8/qldpc_resource.py"
      - "quantum/sha256_transmon_d8/references/**"
      - "tests/test_sha256_zx_optimization.py"
      - "tests/test_sha256_qldpc_resource.py"
      - ".github/workflows/quantum-optimizer.yml"
  pull_request:
    paths:
      - "quantum/sha256_transmon_d8/**"
      - "tests/test_sha256_zx_optimization.py"
      - "tests/test_sha256_qldpc_resource.py"
      - ".github/workflows/quantum-optimizer.yml"
  workflow_dispatch:

jobs:
  exact-unitaries-and-qldpc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install official 2026 optimizer releases
        run: python -m pip install --disable-pip-version-check pytest numpy pyzx==0.10.7 pytket==2.18.5
      - name: Exact quantum optimization and Caltech syndrome schedule
        run: python -m pytest -q tests/test_sha256_zx_optimization.py tests/test_sha256_qldpc_resource.py
